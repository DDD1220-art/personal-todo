<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#245c4a"><meta name="description" content="工作与生活，各自有序。简洁的个人待办管理。">
  <title>有序 · 个人待办</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23245c4a'/%3E%3Cpath d='m10 20 7 7 14-15' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./"><span class="brand-mark">✓</span><span>有序<small>个人待办空间</small></span></a>
    <div class="nav-label">我的空间</div>
    <nav aria-label="任务分类">
      <button class="space active" data-space="work" aria-pressed="true"><span class="space-icon">▣</span>工作<span class="count" id="work-count">0</span></button>
      <button class="space" data-space="life" aria-pressed="false"><span class="space-icon">❋</span>生活<span class="count" id="life-count">0</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="sync-dot"><span></span><span id="connection">正在读取待办…</span></div><button class="account-button" id="account"><span class="avatar">我</span><span id="account-label">同步设置</span><span>↗</span></button></div>
  </aside>
  <main>
    <header class="topbar"><span>我的空间 <span class="slash">/</span> <span id="breadcrumb">工作</span></span><time id="today"></time></header>
    <div class="workspace">
      <div class="page-heading"><div><div class="eyebrow" id="eyebrow">WORKSPACE / 01</div><h1 id="heading">工作待办<span class="heading-dot"></span></h1><p id="subtitle">把要做的事记下来，专注眼前这一件。</p></div><div class="space-emblem" id="emblem" aria-hidden="true">▣</div></div>
      <div class="preview-banner" id="preview-banner"><span id="banner-text">连接 GitHub 后，即可在手机和电脑上修改同一份待办。</span><button id="setup">设置同步 ↗</button></div>
      <section class="composer" aria-label="添加待办"><form id="add-form"><div class="input-line"><span class="plus" aria-hidden="true">＋</span><input id="task-title" aria-label="待办名称" placeholder="添加一件要做的事…" maxlength="240" autocomplete="off" required><button class="primary" id="add-button" type="submit">添加 <span>↵</span></button></div><div class="composer-bottom"><span class="date-label">截止日期</span><div class="date-shortcuts"><button type="button" data-days="0">今天</button><button type="button" data-days="1">明天</button><button type="button" data-days="7">一周后</button><label class="custom-date">自选日期<input id="task-date" type="date" aria-label="自选截止日期" max="9999-12-31"></label><button type="button" id="clear-date" hidden>清除日期 ×</button></div><span class="keyboard-hint">名称必填，其余随心</span></div></form></section>
      <section class="tasks" aria-labelledby="list-title"><div class="section-heading"><h2 id="list-title">待完成 <span id="pending-count">0</span></h2><div class="list-tools"><button id="refresh" aria-label="刷新云端任务">↻ 刷新</button><span class="sort-label">↓ 按截止日期排序</span></div></div><div id="task-list"></div></section>
      <details id="completed-section"><summary>已完成 <span id="completed-count">0</span></summary><div id="completed-list"></div></details>
      <footer class="workspace-footer"><span>一步一步，让事情变得有序。</span><span id="last-sync">未设置日期的任务排在最后</span></footer>
    </div>
  </main>
  <dialog id="edit-dialog"><form id="edit-form"><div class="dialog-heading"><h2>编辑待办</h2><button type="button" class="close" data-close="edit-dialog" aria-label="关闭">×</button></div><label>任务名称<input id="edit-title" maxlength="240" required></label><label>截止日期<input id="edit-date" type="date" max="9999-12-31"></label><label>所属空间<select id="edit-space"><option value="work">工作</option><option value="life">生活</option></select></label><div class="dialog-actions"><button type="button" class="danger" id="delete-task">删除任务</button><button type="submit" class="primary">保存修改</button></div></form></dialog>
  <dialog id="account-dialog"><div class="dialog-heading"><h2>同步设置</h2><button class="close" data-close="account-dialog" aria-label="关闭">×</button></div><form id="connect-form"><p>电脑和手机连接同一个仓库，待办就能同步。</p><label>GitHub 用户名<input id="owner" required autocomplete="off" spellcheck="false"></label><label>仓库名称<input id="repo" required autocomplete="off" spellcheck="false"></label><label>访问令牌（Token）<input id="token" type="password" required autocomplete="off" spellcheck="false" placeholder="仅需所选仓库的 Contents 读写权限"></label><label class="remember"><input id="remember" type="checkbox">记住此设备（仅在自己的设备上勾选）</label><p class="privacy-note">令牌仅发送给 GitHub；勾选后保存在此浏览器，可随时清除。公开仓库中的任务及历史记录也会公开，请勿记录敏感内容。</p><div class="dialog-actions"><button id="disconnect" type="button" class="secondary">清除连接</button><button class="primary" type="submit">连接并同步</button></div></form><p id="auth-message" role="status"></p></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="./config.js"></script><script type="module" src="./app.js"></script>
</body>
</html>
